<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Qorbit — live activity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0c0e;
    --panel: #131417;
    --border: #24262b;
    --ink: #ece7dd;
    --ink-dim: #8f8b83;
    --ink-faint: #5c5954;
    --sun: #e0a458;
    --sun-dim: #7a5a34;
    --serif: "Fraunces", Georgia, serif;
    --mono: "JetBrains Mono", "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; height: 100%;
  }
  .wrap { max-width: 1800px; margin: 0 auto; padding: 44px 28px 64px; }

  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 30px; flex-wrap: wrap; gap: 12px; }
  .title-block h1 {
    font-family: var(--serif); font-weight: 600; font-size: 26px; margin: 0;
    letter-spacing: -0.01em;
  }
  .title-block .sub {
    font-family: var(--mono); font-size: 12px; color: var(--ink-dim);
    margin-top: 4px; letter-spacing: 0.02em;
  }
  .live {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 11.5px; color: var(--sun);
    text-transform: uppercase; letter-spacing: 0.1em;
    border: 1px solid var(--sun-dim); border-radius: 3px; padding: 6px 11px;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--sun);
    box-shadow: 0 0 0 0 rgba(224,164,88,.6); animation: pulse 1.8s ease-out infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(224,164,88,.55); }
    70%  { box-shadow: 0 0 0 8px rgba(224,164,88,0); }
    100% { box-shadow: 0 0 0 0 rgba(224,164,88,0); }
  }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 16px 18px; }
  .stat .label { font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.08em; }
  .stat .value { font-family: var(--serif); font-weight: 500; font-size: 26px; margin-top: 6px; color: var(--ink); }
  .stat .value.accent { color: var(--sun); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 14px 14px 12px; display: flex; flex-direction: column; min-height: 168px;
  }
  .card.new { animation: flash 1.3s ease-out; }
  @keyframes flash { 0% { background: rgba(224,164,88,0.16); } 100% { background: var(--panel); } }
  .card .kind {
    font-family: var(--mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink-dim); border: 1px solid var(--border); border-radius: 3px; padding: 2px 6px;
    display: inline-block; align-self: flex-start; margin-bottom: 8px;
  }
  .card .headline {
    font-family: var(--serif); font-weight: 500; font-size: 14px; line-height: 1.3;
    color: var(--ink); margin: 0 0 6px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card .snippet {
    font-size: 11.5px; line-height: 1.5; color: var(--ink-dim); margin: 0; flex: 1;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card .meta {
    font-family: var(--mono); font-size: 9.5px; color: var(--ink-faint);
    margin-top: 8px;
  }
  .card .readmore {
    margin-top: 10px; display: flex; align-items: center; justify-content: space-between;
    font-family: var(--mono); font-size: 11px; text-decoration: none;
    border: 1px solid var(--border); border-radius: 4px; padding: 7px 9px;
    color: var(--ink);
  }
  .card .readmore:hover { border-color: var(--sun-dim); color: var(--sun); }
  .card .readmore .price { color: var(--sun); font-weight: 600; }
  .empty { grid-column: 1 / -1; padding: 60px 14px; text-align: center; color: var(--ink-faint); font-size: 13px; font-family: var(--mono); }
  footer { margin-top: 16px; font-size: 11px; color: var(--ink-faint); font-family: var(--mono); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  footer a { color: var(--ink-dim); }
  footer a:hover { color: var(--sun); }

  @media (max-width: 640px) {
    .wrap { padding: 24px 16px 40px; }
    .title-block h1 { font-size: 21px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .stats .stat:last-child { grid-column: span 2; }
    .stat .value { font-size: 21px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
    footer { flex-direction: column; gap: 6px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title-block">
        <h1>Qorbit</h1>
        <div class="sub">hedera x402 &middot; live settlement activity</div>
      </div>
      <div class="live"><span class="dot"></span> live</div>
    </header>

    <div class="stats">
      <div class="stat"><div class="label">Settled payments</div><div class="value" id="stat-count">0</div></div>
      <div class="stat"><div class="label">Total volume</div><div class="value accent" id="stat-volume">0 ℏ</div></div>
      <div class="stat"><div class="label">Last settlement</div><div class="value" id="stat-last">&mdash;</div></div>
    </div>

    <div class="grid" id="rows"></div>

    <footer>
      <span id="poll-status">polling /activity every 2.5s</span>
      <span><a href="/">← back to Qorbit</a> &middot; <a href="https://github.com/davieslennox0/hedera-x402">source</a></span>
    </footer>
  </div>

<script>
  const ROWS = document.getElementById("rows");
  const STAT_COUNT = document.getElementById("stat-count");
  const STAT_VOLUME = document.getElementById("stat-volume");
  const STAT_LAST = document.getElementById("stat-last");
  const POLL_STATUS = document.getElementById("poll-status");

  let knownTxIds = new Set();

  function tinybarsToHbar(tinybars) {
    const n = Number(tinybars);
    if (!Number.isFinite(n)) return tinybars;
    return (n / 1e8).toFixed(4) + " ℏ";
  }

  function timeAgo(iso) {
    const diff = Math.max(0, Date.now() - new Date(iso).getTime());
    const s = Math.round(diff / 1000);
    if (s < 5) return "just now";
    if (s < 60) return s + "s ago";
    return Math.round(s / 60) + "m ago";
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  // Guarantees a real preview even for entries recorded before headline/
  // snippet existed (older /paid/quote settlements, or anything from before
  // this deploy) — always at least 15 characters, per spec.
  function fallbackSnippet(e) {
    const base = `Settlement ${e.txId}`;
    return base.length >= 15 ? base : base.padEnd(15, ".");
  }

  function render(entries) {
    if (entries.length === 0) {
      ROWS.innerHTML = '<div class="empty">Waiting for the first settled payment&hellip;</div>';
      STAT_COUNT.textContent = "0";
      STAT_VOLUME.textContent = "0 ℏ";
      STAT_LAST.textContent = "—";
      return;
    }

    let totalTinybars = 0n;
    ROWS.innerHTML = "";
    for (const e of entries) {
      totalTinybars += BigInt(e.amountTinybars === "unknown" ? 0 : e.amountTinybars);
      const card = document.createElement("div");
      card.className = knownTxIds.has(e.txId) ? "card" : "card new";
      const headline = e.headline || (e.kind ? `${e.kind} settlement` : "Quote settlement");
      const snippet = e.snippet || fallbackSnippet(e);
      const hashscanUrl = `https://hashscan.io/testnet/transaction/${encodeURIComponent(e.txId)}`;
      card.innerHTML = `
        <span class="kind">${escapeHtml(e.kind ?? "quote")}</span>
        <p class="headline">${escapeHtml(headline)}</p>
        <p class="snippet">${escapeHtml(snippet)}</p>
        <div class="meta">${timeAgo(e.timestamp)} &middot; ${escapeHtml(e.buyer ?? "—")}</div>
        <a class="readmore" target="_blank" rel="noopener" href="${hashscanUrl}">
          <span>Read more →</span>
          <span class="price">${tinybarsToHbar(e.amountTinybars)}</span>
        </a>
      `;
      ROWS.appendChild(card);
    }

    knownTxIds = new Set(entries.map(e => e.txId));
    STAT_COUNT.textContent = String(entries.length);
    STAT_VOLUME.textContent = tinybarsToHbar(totalTinybars.toString());
    STAT_LAST.textContent = timeAgo(entries[0].timestamp);
  }

  async function poll() {
    try {
      const res = await fetch("/activity", { cache: "no-store" });
      const entries = await res.json();
      render(entries);
      POLL_STATUS.textContent = "polling /activity every 2.5s — last update " + new Date().toLocaleTimeString();
    } catch (err) {
      POLL_STATUS.textContent = "polling /activity every 2.5s — fetch failed, retrying";
    }
  }

  poll();
  setInterval(poll, 2500);
</script>
</body>
</html>
